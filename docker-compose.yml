services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domain_kr
      POSTGRES_USER: domain_kr
      POSTGRES_PASSWORD: domain_kr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domain_kr"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: domain_kr
      DB_USER: domain_kr
      DB_PASS: domain_kr
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production-use-256-bit-key-minimum
      TOSS_SECRET_KEY: test_sk_example
      TOSS_CLIENT_KEY: test_ck_example
      REGISTRAR_MODE: partner            # partner 로 바꾸면 Cloudflare 실연동
      CLOUDFLARE_API_TOKEN: "<CLOUDFLARE_API_TOKEN>"        # Cloudflare API 토큰 (Zone:DNS Edit) — partner 모드 필수
      PAYMENT_MODE: stub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
